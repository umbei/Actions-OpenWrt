name: Build OpenWrt for x86-64 (Lean's LEDE) with VMDK

on:
  workflow_dispatch:
    inputs:
      version:
        description: '分支选择 (master = 最新版 / 24.10 = 稳定版)'
        required: true
        default: 'master'
        type: choice
        options:
          - master
          - 24.10

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: 安装编译环境
      run: |
        sudo apt update
        sudo apt install -y build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
          python3-setuptools rsync swig unzip zlib1g-dev file wget

    - name: 克隆 L大源码
      run: |
        git clone https://github.com/coolsnowwolf/lede
        cd lede
        if [ "${{ github.event.inputs.version }}" != "master" ]; then
          git checkout ${{ github.event.inputs.version }}
        fi

    - name: 更新 Feeds
      run: |
        cd lede
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: 配置固件 (x86-64 + 四个插件 + 10.0.0.101 + 关闭DHCP + VMDK)
      run: |
        cd lede
        
        # 1. 目标架构：x86-64
        echo 'CONFIG_TARGET_x86=y' >> .config
        echo 'CONFIG_TARGET_x86_64=y' >> .config
        echo 'CONFIG_TARGET_x86_64_Generic=y' >> .config
        
        # 2. 启用 VMDK 虚拟机格式 (VMware)
        echo 'CONFIG_VMDK_IMAGES=y' >> .config
        
        # 3. 开启 LuCI 界面
        echo 'CONFIG_PACKAGE_luci=y' >> .config
        echo 'CONFIG_PACKAGE_luci-ssl-openssl=y' >> .config
        echo 'CONFIG_PACKAGE_luci-i18n-base-zh-cn=y' >> .config
        
        # 4. 添加四个插件
        echo 'CONFIG_PACKAGE_luci-app-passwall=y' >> .config
        echo 'CONFIG_PACKAGE_luci-i18n-passwall-zh-cn=y' >> .config
        echo 'CONFIG_PACKAGE_xray-core=y' >> .config
        
        echo 'CONFIG_PACKAGE_luci-app-smartdns=y' >> .config
        echo 'CONFIG_PACKAGE_luci-i18n-smartdns-zh-cn=y' >> .config
        
        echo 'CONFIG_PACKAGE_luci-app-lucky=y' >> .config
        echo 'CONFIG_PACKAGE_luci-i18n-lucky-zh-cn=y' >> .config
        
        echo 'CONFIG_PACKAGE_luci-app-adguardhome=y' >> .config
        echo 'CONFIG_PACKAGE_luci-i18n-adguardhome-zh-cn=y' >> .config
        
        # 5. 基础工具
        echo 'CONFIG_PACKAGE_openssl=y' >> .config
        echo 'CONFIG_PACKAGE_curl=y' >> .config
        echo 'CONFIG_PACKAGE_kmod-usb3=y' >> .config
        
        # 6. 修改默认IP为 10.0.0.101
        sed -i 's/192.168.1.1/10.0.0.101/g' package/base-files/files/bin/config_generate
        
        # 7. 关闭 DHCP
        echo 'CONFIG_PACKAGE_dnsmasq_DHCP=n' >> .config
        echo 'CONFIG_PACKAGE_dnsmasq_DHCPv6=n' >> .config
        echo 'CONFIG_PACKAGE_odhcpd-ipv6only=n' >> .config
        
        # 8. 分区大小调整 (2GB)
        sed -i 's/CONFIG_TARGET_ROOTFS_PARTSIZE=300/CONFIG_TARGET_ROOTFS_PARTSIZE=2048/g' .config 2>/dev/null || \
        echo 'CONFIG_TARGET_ROOTFS_PARTSIZE=2048' >> .config
        
        # 9. 依赖检查
        make defconfig

    - name: 下载源码包
      run: |
        cd lede
        make download -j8
        find dl -size -1024c -exec rm -f {} \;

    - name: 开始编译
      run: |
        cd lede
        make -j$(nproc) || make -j1 V=s

    - name: 上传固件和VMDK虚拟机文件
      uses: actions/upload-artifact@v4
      with:
        name: lede-x64-vmdk
        path: |
          lede/bin/targets/x86/64/*.vmdk
          lede/bin/targets/x86/64/*.img.gz
          lede/bin/targets/x86/64/sha256sums
        retention-days: 7
